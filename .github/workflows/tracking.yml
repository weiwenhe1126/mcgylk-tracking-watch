name: Logistics Tracking On Demand

on:
  schedule:
    # 每 5 分钟检查一次收件箱（GitHub 支持的最短间隔）
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: logistics-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .tracking_state.json
          key: logistics-state-${{ github.run_id }}
          restore-keys: |
            logistics-state-

      - name: Poll mailbox and reply
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH: ${{ secrets.MAIL_AUTH }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 tracking.py
